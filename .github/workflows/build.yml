name: Build Desktop Apps (v4.1)

# ─────────────────────────────────────────────────────────────────────────────
#  CI / CD pipeline v4.1 for the System Resource Optimizer
#    • test       — runs on every push / PR (compile checks + safety test suite)
#    • build-*    — build macOS .dmg and Windows .exe (after tests pass)
#    • release    — publish a GitHub Release on version tags (e.g. v4.1.0)
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:        # allow manual trigger from the GitHub UI

env:
  DEFAULT_VERSION: "v4.1.4"

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # 1) Continuous Integration — compile checks + safety/notification tests
  # ───────────────────────────────────────────────────────────────────────────
  test:
    name: CI — compile & safety tests
    runs-on: ubuntu-latest
    continue-on-error: true   # informational only — never blocks the build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install onnxruntime         # ensure inference runtime is present

      - name: Byte-compile all sources
        run: python -m compileall -q src

      - name: Run safety & notification test suite
        run: python src/tests/test_safety_and_notifications.py
        env:
          PYTHONPATH: src

  # ───────────────────────────────────────────────────────────────────────────
  # 2) macOS → System Resource Optimizer.app  →  .dmg
  # ───────────────────────────────────────────────────────────────────────────
  build-macos:
    name: Build macOS (.dmg)
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install onnxruntime pyinstaller pillow

      - name: Convert icon to ICNS
        run: |
          cd src
          if [ -f assets/icon_proper.png ]; then SRC=assets/icon_proper.png;
          elif [ -f assets/icon.png ]; then SRC=assets/icon.png; else SRC=""; fi
          if [ -n "$SRC" ]; then
            ICONSET=assets/icon.iconset
            mkdir -p "$ICONSET"
            for SIZE in 16 32 64 128 256 512; do
              sips -z $SIZE $SIZE "$SRC" --out "$ICONSET/icon_${SIZE}x${SIZE}.png" >/dev/null 2>&1
              DOUBLE=$((SIZE*2))
              sips -z $DOUBLE $DOUBLE "$SRC" --out "$ICONSET/icon_${SIZE}x${SIZE}@2x.png" >/dev/null 2>&1
            done
            iconutil -c icns "$ICONSET" -o assets/icon.icns 2>/dev/null || true
          else
            echo "No icon found, skipping."
          fi

      - name: Create version.txt
        shell: bash
        run: |
          mkdir -p src/assets
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "${{ github.ref_name }}" > src/assets/version.txt
          else
            echo "${{ env.DEFAULT_VERSION }}" > src/assets/version.txt
          fi
          echo "Built with version: $(cat src/assets/version.txt)"

      - name: Build .app with PyInstaller
        run: pyinstaller SystemResourceOptimizer.spec --clean -y

      - name: Create DMG
        run: |
          cd dist
          APP="System Resource Optimizer.app"
          if [ ! -d "$APP" ]; then
            echo "Error: $APP not found in dist/"; ls -1; exit 1
          fi
          # Detach any volume left mounted by a previous attempt.
          hdiutil detach "/Volumes/System Resource Optimizer" 2>/dev/null || true
          sync
          # hdiutil can fail transiently with "Resource busy" when Spotlight is
          # still indexing the freshly built .app, so retry with a backoff.
          ok=0
          for i in 1 2 3 4 5; do
            if hdiutil create -volname "System Resource Optimizer" \
                 -srcfolder "$APP" -fs HFS+ \
                 -ov -format UDZO "System_Resource_Optimizer.dmg"; then
              echo "DMG created on attempt $i"; ok=1; break
            fi
            echo "hdiutil attempt $i failed (Resource busy?); retrying in 15s..."
            hdiutil detach "/Volumes/System Resource Optimizer" 2>/dev/null || true
            sync; sleep 15
          done
          if [ "$ok" != "1" ]; then
            echo "Error: DMG creation failed after 5 attempts"; exit 1
          fi
          ls -lh System_Resource_Optimizer.dmg

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macOS-DMG
          path: dist/System_Resource_Optimizer.dmg
          retention-days: 30

  # ───────────────────────────────────────────────────────────────────────────
  # 3) Windows → SystemResourceOptimizer.exe (+ service)
  # ───────────────────────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install onnxruntime pyinstaller pillow

      - name: Create version.txt
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src/assets
          $ref = "${{ github.ref }}"
          if ($ref -like "refs/tags/*") {
            Set-Content -Path src/assets/version.txt -Value "${{ github.ref_name }}"
          } else {
            Set-Content -Path src/assets/version.txt -Value "${{ env.DEFAULT_VERSION }}"
          }
          Write-Host "Built with version: $(Get-Content src/assets/version.txt)"

      - name: Build .exe with PyInstaller
        run: pyinstaller SystemResourceOptimizer.spec --clean -y

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Exe
          path: |
            dist/SystemResourceOptimizer.exe
            dist/SystemResourceOptimizerService.exe
          retention-days: 30

  # ───────────────────────────────────────────────────────────────────────────
  # 4) Release — only on version tags (git tag v3.1.0 && git push origin v3.1.0)
  # ───────────────────────────────────────────────────────────────────────────
  release:
    name: Publish GitHub Release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: macOS-DMG
          path: release/
          merge-multiple: true

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: Windows-Exe
          path: release/
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/System_Resource_Optimizer.dmg
            release/SystemResourceOptimizer.exe
            release/SystemResourceOptimizerService.exe
          body: |
            ## System Resource Optimizer — ${{ github.ref_name }}

            ### Downloads
            | Platform | File |
            |---|---|
            | 🍎 macOS | `System_Resource_Optimizer.dmg` (Dashboard + Background Service) |
            | 🪟 Windows | `SystemResourceOptimizer.exe` (Dashboard) & `SystemResourceOptimizerService.exe` (Silent Background Service) |

            ### First Launch
            - **macOS**: open the `.dmg`, drag the app to Applications. The Dashboard auto-starts the silent background service.
            - **Windows**: place both `.exe` files in the same folder and run `SystemResourceOptimizer.exe`; it starts the service automatically.
