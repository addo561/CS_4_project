name: Build Desktop Apps

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:      # allows manual trigger from GitHub UI

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # macOS → System Resource Optimizer.app  (zipped)
  # ────────────────────────────────────────────────────────────────────────────
  build-macos:
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install flet flet-desktop psutil numpy scikit-learn onnxruntime PyQt6 pyqtgraph plyer pyinstaller pillow


      - name: Convert icon to ICNS
        run: |
          mkdir -p assets
          cp assets/icon_proper.png assets/icon_build.png 2>/dev/null || \
          cp assets/icon.png        assets/icon_build.png 2>/dev/null || \
          echo "No icon found, skipping"

          if [ -f assets/icon_build.png ]; then
            ICONSET=assets/icon.iconset
            mkdir -p "$ICONSET"
            for SIZE in 16 32 64 128 256 512; do
              sips -z $SIZE $SIZE assets/icon_build.png \
                --out "$ICONSET/icon_${SIZE}x${SIZE}.png" > /dev/null 2>&1
              DOUBLE=$((SIZE*2))
              sips -z $DOUBLE $DOUBLE assets/icon_build.png \
                --out "$ICONSET/icon_${SIZE}x${SIZE}@2x.png" > /dev/null 2>&1
            done
            iconutil -c icns "$ICONSET" -o assets/icon.icns 2>/dev/null || true
          fi

      - name: Create version.txt
        shell: bash
        run: |
          mkdir -p src/assets
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
            echo "$TAG" > src/assets/version.txt
          else
            echo "v2.9.3" > src/assets/version.txt
          fi
          echo "Built with version: $(cat src/assets/version.txt)"

      - name: Build .app with PyInstaller
        run: pyinstaller SystemResourceOptimizer.spec --clean -y

      - name: Create DMG
        run: |
          echo "Listing dist directory for debugging:"
          ls -R dist
          cd dist
          if [ -d "System Resource Optimizer.app" ]; then
            hdiutil create -volname "System Resource Optimizer" \
              -srcfolder "System Resource Optimizer.app" \
              -ov -format UDZO "System_Resource_Optimizer.dmg"
          else
            echo "Error: System Resource Optimizer.app not found in dist/"
            exit 1
          fi

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macOS-DMG
          path: dist/System_Resource_Optimizer.dmg
          retention-days: 30

  # ────────────────────────────────────────────────────────────────────────────
  # Windows → SystemResourceOptimizer.exe  (zipped)
  # ────────────────────────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install flet flet-desktop psutil numpy scikit-learn onnxruntime PyQt6 pyqtgraph plyer pyinstaller pillow

      - name: Create version.txt
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src/assets
          $ref = "${{ github.ref }}"
          if ($ref -like "refs/tags/*") {
            $tag = "${{ github.ref_name }}"
            Set-Content -Path src/assets/version.txt -Value $tag
          } else {
            Set-Content -Path src/assets/version.txt -Value "v2.9.3"
          }
          Write-Host "Built with version: $(Get-Content src/assets/version.txt)"

      - name: Build .exe with PyInstaller
        run: pyinstaller SystemResourceOptimizer.spec --clean -y

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Exe
          path: |
            dist/SystemResourceOptimizer.exe
            dist/SystemResourceOptimizerService.exe
          retention-days: 30

  # ────────────────────────────────────────────────────────────────────────────
  # Create a GitHub Release with both downloads (only on version tags)
  # Push a tag like:  git tag v1.0 && git push origin v1.0
  # ────────────────────────────────────────────────────────────────────────────
  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: macOS-DMG
          path: release/
          merge-multiple: true

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: Windows-Exe
          path: release/
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/System_Resource_Optimizer.dmg
            release/SystemResourceOptimizer.exe
            release/SystemResourceOptimizerService.exe
          body: |
            ## System Resource Optimizer — ${{ github.ref_name }}

            ### Downloads
            | Platform | File |
            |---|---|
            | 🍎 macOS | `System_Resource_Optimizer.dmg` (Contains both Dashboard and Background Service) |
            | 🪟 Windows | `SystemResourceOptimizer.exe` (Dashboard Client) & `SystemResourceOptimizerService.exe` (Silent Background Service) |

            ### First Launch & Usage
            - **macOS**: Double-click `System_Resource_Optimizer.dmg`, drag the app to Applications. The Dashboard will auto-start the silent background service process.
            - **Windows**: Download both `.exe` files into the same folder. Launch `SystemResourceOptimizer.exe` (Dashboard), which will automatically start `SystemResourceOptimizerService.exe` (Silent Background Service) in the background.
